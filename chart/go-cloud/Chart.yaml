apiVersion: v2
name: go-cloud
description: Key-Value Store HTTP API with PostgreSQL, Redis, Prometheus and Grafana
type: application
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: "~16.0.0"
    condition: postgresql.enabled
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    version: "~20.0.0"
    condition: redis.enabled
  - name: prometheus
    repository: oci://registry-1.docker.io/bitnamicharts
    version: "~2.0.0"
    condition: prometheus.enabled
  - name: grafana
    repository: oci://registry-1.docker.io/bitnamicharts
    version: "~12.0.0"
    condition: grafana.enabled
