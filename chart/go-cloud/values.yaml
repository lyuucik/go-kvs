app:
  name: go-cloud
  image: ghcr.io/lyuucik/go-kvs
  tag: 7787bc0144ae1b5d6e1aa9e6e4152690954e25b3
  pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  cacheTtl: 60s
  resources: {}
  probes:
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10

ingress:
  enabled: true
  className: nginx
  host: ""
  paths:
    - path: /
      pathType: Prefix

# Service names follow the pattern: <release>-<chart>
# App service:  go-cloud-svc
# PG:           go-cloud-postgresql:5432
# Redis:        go-cloud-redis:6379
# Prometheus:   go-cloud-prometheus-server:9090
# Grafana:      go-cloud-grafana:3000

postgresql:
  enabled: true
  auth:
    postgresPassword: password
    database: kvs
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        memory: 256Mi
        cpu: 250m

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        memory: 128Mi
        cpu: 100m

prometheus:
  enabled: true
  alertmanager:
    enabled: false
  server:
    persistence:
      enabled: false
    scrapeInterval: 15s
    extraScrapeConfigs:
      - job_name: go-cloud
        static_configs:
          - targets:
              - '{{ .Release.Name }}-svc:80'
        metrics_path: /metrics
    resources:
      requests:
        memory: 256Mi
        cpu: 250m

grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: false
  datasources:
    secretDefinition:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://{{ .Release.Name }}-prometheus-server:9090
          isDefault: true
  dashboardsProvider:
    enabled: true
  dashboardsConfigMaps:
    - configMapName: grafana-dashboard
      folderName: dashboards
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
