# Namespace override (defaults to release namespace)
namespaceOverride: ""

app:
  name: go-cloud
  image: ghcr.io/lyuucik/go-kvs
  tag: 25c85b003966fe97c1bfd49cbc90363bfdfdd431
  pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  env:
    databaseUrl: postgres://postgres:password@postgres:5432/kvs?sslmode=disable
    redisUrl: redis://redis:6379/0
    cacheTtl: "300"
  probes:
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10

postgres:
  enabled: true
  image: postgres:16-alpine
  password: password
  database: kvs
  port: 5432
  persistence:
    enabled: false
    size: 10Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

ingress:
  enabled: true
  className: nginx
  host: ""
  paths:
    - path: /
      pathType: Prefix

monitoring:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.55.0
    port: 9090
    retention: 7d
    scrapeInterval: 15s
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
  grafana:
    enabled: true
    image: grafana/grafana:11.3.0
    port: 3000
    adminPassword: admin
    serviceType: ClusterIP
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m


