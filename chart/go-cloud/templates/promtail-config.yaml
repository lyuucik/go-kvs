{{- if .Values.monitoring.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    {{- include "go-cloud.labels" . | nindent 4 }}
data:
  config.yaml: |
    clients:
      - url: http://loki:{{ .Values.monitoring.loki.port }}/loki/api/v1/push
    positions:
      filename: /run/promtail/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: []
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        relabel_configs:
          - source_labels: [__path__]
            regex: /var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\.log
            replacement: '${1}'
            target_label: namespace
          - source_labels: [__path__]
            regex: /var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\.log
            replacement: '${2}'
            target_label: pod
          - source_labels: [__path__]
            regex: /var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\.log
            replacement: '${4}'
            target_label: container
{{- end }}
