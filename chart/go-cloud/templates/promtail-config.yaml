{{- if .Values.monitoring.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    {{- include "go-cloud.labels" . | nindent 4 }}
data:
  config.yaml: |
    clients:
      - url: http://loki:{{ .Values.monitoring.loki.port }}/loki/api/v1/push
    positions:
      filename: /run/promtail/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: []
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - regex:
              expression: "^(?P<timestamp>\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2}:\\d{2})"
          - timestamp:
              source: timestamp
              format: "2006/01/02 15:04:05"
{{- end }}
