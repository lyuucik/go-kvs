apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'go-cloud'
        static_configs:
          - targets: ['go-cloud-svc:80']
        metrics_path: /metrics
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
